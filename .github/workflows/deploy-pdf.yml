name: Deploy private PDF renderer
permissions:
  contents: read
defaults:
  run:
    shell: python3 scripts/private_workflow_step.py {0}
on:
  push:
    branches: [main]
    paths:
      - "pdf_worker/**"
      - ".github/workflows/deploy-pdf.yml"
  workflow_dispatch:
concurrency:
  group: otomy-private-pdf-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned renderer dependencies
        run: npm ci --prefix pdf_worker --ignore-scripts --no-audit --no-fund
      - name: Verify PDF security boundary
        run: node scripts/test_pdf_route.mjs
      - name: Deploy private Worker without public URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "95339738c3c36e84444485e07178e635"
        run: npm run deploy --prefix pdf_worker
