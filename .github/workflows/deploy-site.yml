name: Deploy site to Pages

# Publishes the FRONTEND + the /data/ Pages Function. Data itself is served LIVE
# from R2 by functions/data/[[path]].js (binding OTOMY_DATA), so this deploy no
# longer bundles data and does NOT need to run on a schedule — the 10-min sync keeps
# R2 current and the site reads it live. Run this only when the frontend/Function changes.
on:
  push:
    paths:
      - "index.html"
      - "static/**"
      - "functions/**"
      - "service-worker.js"
      - "CNAME"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: otomy-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage deploy bundle (frontend + Function, data served live from R2)
        run: |
          mkdir -p _site
          cp index.html service-worker.js CNAME .nojekyll _site/
          cp -R static _site/static
          cp -R functions _site/functions
          echo "Staged files: $(find _site -type f | wc -l)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "95339738c3c36e84444485e07178e635"
        run: npx --yes wrangler@latest pages deploy _site --project-name otomy-ai --branch main --commit-dirty=true
