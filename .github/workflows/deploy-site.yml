name: Deploy site to Pages

# Publishes the FRONTEND (index.html + assets) together with the CURRENT data
# pulled fresh from R2. The 10-minute sync only updates R2; it does NOT publish
# the Pages site. Run this whenever the frontend changes, or on a schedule to keep
# the deployed data current.
on:
  workflow_dispatch:

concurrency:
  group: otomy-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull current data from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync "s3://otomy-data" data --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors

      - name: Stage deploy bundle (frontend + data, no repo cruft)
        run: |
          mkdir -p _site
          cp index.html service-worker.js CNAME .nojekyll _site/
          cp -R static _site/static
          cp -R data _site/data
          echo "Staged files: $(find _site -type f | wc -l)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "95339738c3c36e84444485e07178e635"
        run: npx --yes wrangler@latest pages deploy _site --project-name otomy-ai --branch main --commit-dirty=true
