name: Seed R2 config (one-shot)
# Manually-triggered helper: push version-controlled config files (balance anchors +
# bank statement) from seed/ into the Cloudflare R2 data bucket so the next sync picks
# them up. R2 is otomy's data source of truth; these config files are otherwise not in git.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload seed config to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          # Statement first, then anchors — so the overlay never points at a missing file.
          aws s3 cp "seed/bank_statement_icici_2026-04-01_2026-06-28.json" \
            "s3://otomy-data/bank_statement_icici_2026-04-01_2026-06-28.json" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
          aws s3 cp "seed/balance_anchors.json" \
            "s3://otomy-data/balance_anchors.json" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
          echo "Seeded balance_anchors.json + April-1 statement into R2."
