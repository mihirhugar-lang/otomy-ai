name: Common engine sync

on:
  # The common engine is the only Otomy data writer. It runs in GitHub Actions,
  # so a sleeping/offline Mac cannot make the cloud dashboard stale.
  # A Cloudflare Cron Worker dispatches this workflow every 15 minutes during
  # the day and once per hour from 11 PM–7 AM IST. Keeping the clock outside
  # GitHub avoids dropped/delayed GitHub scheduled events.
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "Common-engine rebuild mode"
        type: choice
        options:
          - full
          - recent
        default: full
      full_from:
        description: "Full rebuild start date (YYYY-MM-DD)"
        required: false
        default: "2026-04-01"

concurrency:
  group: otomy-common-engine-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check common-engine control state
        id: initial_control
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          control_file="$RUNNER_TEMP/otomy-engine-state.json"
          error_file="$RUNNER_TEMP/otomy-engine-state.err"
          set +e
          aws s3 cp "s3://otomy-data/control/engine_state.json" "$control_file" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors 2>"$error_file"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -Eqi '404|not found|does not exist|nosuchkey' "$error_file"; then
              echo "No control file exists yet; defaulting to running."
              state="running"
            else
              cat "$error_file" >&2
              echo "Unable to read the engine control state; refusing to run." >&2
              exit 1
            fi
          else
            state="$(jq -r '.state // "running"' "$control_file")"
            case "$state" in
              running|paused) ;;
              *) echo "Invalid engine control state: $state" >&2; exit 1 ;;
            esac
          fi
          if [ "$state" = "paused" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "state=paused" >> "$GITHUB_OUTPUT"
            echo "Common engine is PAUSED; no ERP read or R2 write will run."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "state=running" >> "$GITHUB_OUTPUT"
            echo "Common engine is RUNNING."
          fi

      - name: Pull current R2 state
        if: steps.initial_control.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync "s3://otomy-data" data --endpoint-url "${{ secrets.R2_ENDPOINT }}" --exclude "recovery/*" --exact-timestamps --only-show-errors

      - name: Save previous publish manifest
        if: steps.initial_control.outputs.enabled == 'true'
        run: |
          if [ -f data/publish_manifest.json ]; then
            cp data/publish_manifest.json "$RUNNER_TEMP/otomy-previous-publish-manifest.json"
          else
            rm -f "$RUNNER_TEMP/otomy-previous-publish-manifest.json"
          fi

      - name: Install dependencies
        if: steps.initial_control.outputs.enabled == 'true'
        run: python3 -m pip install --quiet requests

      - name: Run canonical cashbook fixture guard
        if: steps.initial_control.outputs.enabled == 'true'
        run: python3 scripts/test_cashbook_parity.py

      - name: Run the single Loctell common engine
        if: steps.initial_control.outputs.enabled == 'true'
        env:
          ERP_BASE: ${{ secrets.ERP_BASE }}
          ERP_ORG: ${{ secrets.ERP_ORG }}
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASS: ${{ secrets.ERP_PASS }}
          OTOMY_SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_mode || 'recent' }}
          OTOMY_FULL_FROM: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_from || '2026-04-01' }}
          OTOMY_RECENT_DAYS: "7"
          OTOMY_ERP_RETRIES: "3"
          OTOMY_ERP_RETRY_DELAY: "1.5"
          OTOMY_DEBTOR_WORKERS: "4"
          OTOMY_BALANCE_WORKERS: "4"
        run: python3 scripts/gha_sync.py

      - name: Verify the generated common bundle
        if: steps.initial_control.outputs.enabled == 'true'
        run: |
          python3 scripts/verify_dashboard_parity.py
          # Validate the generated historical ledger/cashbook before any R2
          # object is touched.  Read-back remains an integrity check; this
          # pre-publish guard makes a bad recent build unable to go live.
          python3 scripts/verify_r2_readback.py data data

      - name: Build content delta publish plan
        if: steps.initial_control.outputs.enabled == 'true'
        env:
          OTOMY_REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_mode || 'recent' }}
        run: |
          python3 scripts/delta_manifest.py \
            --root data \
            --previous "$RUNNER_TEMP/otomy-previous-publish-manifest.json" \
            --manifest data/publish_manifest.json \
            --changed-root "$RUNNER_TEMP/otomy-publish-delta" \
            --changed "$RUNNER_TEMP/otomy-changed-files.txt" \
            --deleted "$RUNNER_TEMP/otomy-deleted-objects.json" \
            --plan "$RUNNER_TEMP/otomy-publish-plan.json" \
            --requested-mode "$OTOMY_REQUESTED_MODE" \
            --run-id "$GITHUB_RUN_ID"

      - name: Re-check common-engine control before publish
        id: prepublish_control
        if: steps.initial_control.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          control_file="$RUNNER_TEMP/otomy-engine-state-before-publish.json"
          error_file="$RUNNER_TEMP/otomy-engine-state-before-publish.err"
          set +e
          aws s3 cp "s3://otomy-data/control/engine_state.json" "$control_file" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors 2>"$error_file"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -Eqi '404|not found|does not exist|nosuchkey' "$error_file"; then
              state="running"
            else
              cat "$error_file" >&2
              echo "Unable to re-check the engine control state; refusing to publish." >&2
              exit 1
            fi
          else
            state="$(jq -r '.state // "running"' "$control_file")"
          fi
          if [ "$state" = "paused" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "state=paused" >> "$GITHUB_OUTPUT"
            echo "Engine was paused while this run was processing; verified output will not be published."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "state=running" >> "$GITHUB_OUTPUT"
            echo "Engine remains running; verified output may be published."
          fi

      - name: Save the previous verified bundle for rollback
        id: recovery
        if: steps.initial_control.outputs.enabled == 'true' && steps.prepublish_control.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          recovery_id="$GITHUB_RUN_ID"
          recovery_meta="$RUNNER_TEMP/otomy-recovery-manifest.json"
          recovery_backup_list="$RUNNER_TEMP/otomy-recovery-backup-keys.txt"
          recovery_remove_list="$RUNNER_TEMP/otomy-recovery-remove-on-restore.txt"
          python3 scripts/recovery_plan.py create \
            --previous "$RUNNER_TEMP/otomy-previous-publish-manifest.json" \
            --current data/publish_manifest.json \
            --publish-plan "$RUNNER_TEMP/otomy-publish-plan.json" \
            --recovery-id "$recovery_id" \
            --metadata "$recovery_meta" \
            --backup-list "$recovery_backup_list" \
            --remove-list "$recovery_remove_list"
          if [ "$(jq -r '.available' "$recovery_meta")" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No prior verified bundle exists yet; bootstrap publish has no rollback target."
            exit 0
          fi

          recovery_prefix="recovery/$recovery_id/objects"
          publish_mode="$(jq -r '.mode' "$recovery_meta")"
          if [ "$publish_mode" = "full" ]; then
            # A full rebuild can delete any live data key, so retain the full
            # previous bundle.  This is intentionally rare; regular syncs use
            # the small changed/deleted-object path below.
            aws s3 cp "s3://otomy-data" "s3://otomy-data/$recovery_prefix" \
              --recursive --exclude "control/*" --exclude "recovery/*" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors
          else
            include_args=(--exclude "*")
            while IFS= read -r key; do
              [ -n "$key" ] && include_args+=(--include "$key")
            done < "$recovery_backup_list"
            aws s3 cp "s3://otomy-data" "s3://otomy-data/$recovery_prefix" \
              --recursive "${include_args[@]}" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors
          fi
          # R2 is strongly consistent.  Writing this metadata object last
          # makes a recovery visible only after all old objects were copied.
          python3 scripts/recovery_plan.py validate --metadata "$recovery_meta"
          aws s3 cp "$recovery_meta" "s3://otomy-data/recovery/$recovery_id/recovery_manifest.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json --only-show-errors

          current_catalog="$RUNNER_TEMP/otomy-recovery-catalog-current.json"
          if [ -f data/control/recovery_catalog.json ]; then
            cp data/control/recovery_catalog.json "$current_catalog"
          else
            printf '%s\n' '{"catalog_version":1,"recoveries":[]}' > "$current_catalog"
          fi
          unpruned_catalog="$RUNNER_TEMP/otomy-recovery-catalog-unpruned.json"
          empty_cleanup="$RUNNER_TEMP/otomy-recovery-empty-cleanup.txt"
          python3 scripts/recovery_catalog.py \
            --catalog "$current_catalog" --recovery "$recovery_meta" \
            --out "$unpruned_catalog" --cleanup "$empty_cleanup"
          # Publish the catalog before the live overwrite.  If the following
          # publish fails halfway through, the rollback button can still find
          # this exact prior bundle.
          aws s3 cp "$unpruned_catalog" "s3://otomy-data/control/recovery_catalog.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json --only-show-errors
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "id=$recovery_id" >> "$GITHUB_OUTPUT"
          echo "Recovery $recovery_id is ready before live publish."

      - name: Publish the verified bundle to R2
        if: steps.initial_control.outputs.enabled == 'true' && steps.prepublish_control.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          publish_mode="$(jq -r '.publish_mode' "$RUNNER_TEMP/otomy-publish-plan.json")"
          if [ "$publish_mode" = "full" ]; then
            # Keep the readiness marker until all content is uploaded. It is
            # replaced below only after the full publish succeeds.
            aws s3 sync data "s3://otomy-data" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
              --delete --exclude "publish_manifest.json" --exclude "control/*" --exclude "recovery/*" --only-show-errors
          else
            aws s3 sync "$RUNNER_TEMP/otomy-publish-delta" "s3://otomy-data" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
            if [ -s "$RUNNER_TEMP/otomy-deleted-objects.json" ] && [ "$(jq '.Objects | length' "$RUNNER_TEMP/otomy-deleted-objects.json")" -gt 0 ]; then
              aws s3api delete-objects \
                --bucket otomy-data \
                --delete "file://$RUNNER_TEMP/otomy-deleted-objects.json" \
                --endpoint-url "${{ secrets.R2_ENDPOINT }}"
            fi
          fi
          # Publish the manifest last. It is the release/readiness marker for
          # the complete key set represented by this verified engine run.
          aws s3 cp data/publish_manifest.json "s3://otomy-data/publish_manifest.json" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors

      - name: Read back and verify the exact R2 bundle
        if: steps.initial_control.outputs.enabled == 'true' && steps.prepublish_control.outputs.enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          publish_mode="$(jq -r '.publish_mode' "$RUNNER_TEMP/otomy-publish-plan.json")"
          if [ "$publish_mode" = "full" ]; then
            readback_dir="$(mktemp -d)"
            aws s3 sync "s3://otomy-data" "$readback_dir" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --delete --exclude "control/*" --exclude "recovery/*" --exact-timestamps --only-show-errors
            python3 scripts/verify_r2_readback.py data "$readback_dir"
          else
            readback_dir="$(mktemp -d)"
            remote_manifest="$RUNNER_TEMP/otomy-remote-publish-manifest.json"
            remote_keys="$RUNNER_TEMP/otomy-remote-keys.txt"
            aws s3 cp "s3://otomy-data/publish_manifest.json" "$remote_manifest" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
            aws s3 ls "s3://otomy-data" --recursive \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
              | awk '$4 !~ /^(control|recovery)\// {print $4}' | sort > "$remote_keys"
            include_args=(--include "publish_manifest.json")
            while IFS= read -r key; do
              [ -n "$key" ] && include_args+=(--include "$key")
            done < "$RUNNER_TEMP/otomy-changed-files.txt"
            aws s3 cp "s3://otomy-data" "$readback_dir" --recursive \
              --exclude "*" "${include_args[@]}" \
              --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
            python3 scripts/verify_r2_delta.py \
              data "$readback_dir" "$remote_manifest" "$remote_keys" \
              "$RUNNER_TEMP/otomy-changed-files.txt" "$RUNNER_TEMP/otomy-deleted-objects.json"
          fi

      - name: Retain the two newest rollback recoveries
        if: steps.recovery.outputs.available == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          retained_catalog="$RUNNER_TEMP/otomy-recovery-catalog-retained.json"
          cleanup_list="$RUNNER_TEMP/otomy-recovery-cleanup.txt"
          python3 scripts/recovery_catalog.py \
            --catalog "$RUNNER_TEMP/otomy-recovery-catalog-unpruned.json" \
            --recovery "$RUNNER_TEMP/otomy-recovery-manifest.json" \
            --out "$retained_catalog" --cleanup "$cleanup_list" --prune
          while IFS= read -r recovery_id; do
            case "$recovery_id" in
              ''|*[!0-9A-Za-z._-]*) echo "Unsafe recovery id in cleanup list" >&2; exit 1 ;;
            esac
            aws s3 rm "s3://otomy-data/recovery/$recovery_id" --recursive \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done < "$cleanup_list"
          aws s3 cp "$retained_catalog" "s3://otomy-data/control/recovery_catalog.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json --only-show-errors
          {
            echo '## Recovery retained'
            echo
            echo "Previous verified bundle available as recovery \`${{ steps.recovery.outputs.id }}\`."
            echo 'The catalog keeps the two newest recovery packs, each for at most 14 days.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report paused engine
        if: steps.initial_control.outputs.enabled != 'true'
        run: |
          {
            echo '## Common engine paused'
            echo
            echo 'No ERP request, calculation, or R2 publish was performed.'
            echo 'The last verified dataset remains live.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report publish skipped after pause
        if: steps.initial_control.outputs.enabled == 'true' && steps.prepublish_control.outputs.enabled != 'true'
        run: |
          {
            echo '## Common engine pause observed'
            echo
            echo 'The run stopped before publishing because the engine was paused.'
            echo 'The last verified dataset remains live.'
          } >> "$GITHUB_STEP_SUMMARY"
