name: Verify Otomy guards
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: python3 scripts/private_workflow_step.py {0}
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        # Pinned v3 action; comments, SARIF artifacts, and summaries stay off
        # so a finding cannot copy sensitive source into another GitHub surface.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Install fixture dependencies
        run: python3 -m pip install --quiet requests 'boto3==1.42.97' 'cryptography==46.0.7' 'PyYAML==6.0.3'
      - name: Verify public workflow privacy boundary
        run: python3 scripts/test_private_workflow_step.py
      - name: Verify private incremental R2 input cache
        run: |
          python3 scripts/test_pull_r2_incremental.py
          python3 scripts/test_r2_working_set.py
      - name: Run canonical cashbook fixture guard
        run: |
          python3 scripts/test_cashbook_parity.py
          python3 scripts/test_shared_calculations.py
          python3 scripts/test_book_calculations.py
          python3 scripts/test_party_calculations.py
          python3 scripts/test_sale_split_guard.py
          python3 scripts/test_vendor_aging.py
      - name: Run rollback recovery fixture guard
        run: |
          python3 scripts/test_recovery_plan.py
          python3 scripts/test_r2_transfers.py
      - name: Run R2 storage-budget fixture guard
        run: python3 scripts/test_r2_storage_guard.py
      - name: Run R2 snapshot-retention safety guard
        run: python3 scripts/test_snapshot_retention.py
      - name: Verify internal R2 prefixes stay private
        run: node scripts/test_data_route_guard.mjs
      - name: Verify frontend loading and changed-object readback
        run: |
          node scripts/test_frontend_loading.js
          node sync_trigger/test_queue_guard.js
          python3 scripts/test_readback_changed_r2.py
          python3 scripts/test_dashboard_balance_parity.py
          python3 scripts/test_historical_vendor_repair.py
      - name: Verify private PDF authentication and sharing boundary
        run: node scripts/test_pdf_route.mjs
      - name: Verify dashboard parity guard
        run: python3 scripts/verify_dashboard_parity.py --code-only
