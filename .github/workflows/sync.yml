name: Refresh JSON data
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes on GitHub's servers
  workflow_dispatch:           # manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch meta to trigger rebuild
        run: |
          echo "{\"last_refresh\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/meta_gha.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meta_gha.json
          git diff --cached --quiet || git commit -m "gha: heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
