name: Refresh JSON data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: otomy-erp-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: python3 -m pip install --quiet requests

      - name: Fetch from ERP and generate JSON
        env:
          ERP_BASE: ${{ secrets.ERP_BASE }}
          ERP_ORG: ${{ secrets.ERP_ORG }}
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASS: ${{ secrets.ERP_PASS }}
          OTOMY_SYNC_MODE: recent
          OTOMY_RECENT_DAYS: "7"
          OTOMY_ERP_RETRIES: "3"
          OTOMY_ERP_RETRY_DELAY: "1.5"
          OTOMY_DEBTOR_WORKERS: "4"
          OTOMY_BALANCE_WORKERS: "4"
        run: python3 scripts/gha_sync.py

      - name: Verify dashboard parity guard
        run: python3 scripts/verify_dashboard_parity.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git add data/
          git restore --staged data/meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          elif ! python3 scripts/staged_data_has_meaningful_changes.py; then
            echo "Only volatile sync timestamps changed; skipping commit"
            git restore --staged data/
            git checkout -- data/
          else
            git commit -m "erp: $(date -u +%H:%M)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push rejected; fetching latest main and retrying ($attempt/3)"
              git fetch origin main
              git rebase -X theirs origin/main
            done
            git push origin HEAD:main
          fi
