name: Refresh JSON data
on:
  # Keep the ERP/R2 snapshot refreshed throughout the India business day.
  schedule:
    - cron: '30,40,50 0 * * *'
    - cron: '*/10 1-16 * * *'
    - cron: '0,10,20 17 * * *'
    - cron: '30 17 * * *'
    - cron: '0,30 18-23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      full_cust_ledgers:
        description: "Force a full customer-ledger refresh this run"
        type: boolean
        default: false
      sync_mode:
        description: "Sync window: recent, monthly, or full historical rebuild"
        type: choice
        options:
          - recent
          - monthly
          - full
        default: recent
      full_from:
        description: "Start date for a full historical rebuild (YYYY-MM-DD)"
        required: false
        default: "2026-04-01"

concurrency:
  group: otomy-erp-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # NOTE: the actions/cache step was removed 2026-08-01. It restored the previous run's
      # data/ with a fresh mtime, so `aws s3 sync` treated the stale local copy as up-to-date
      # and skipped downloading files edited directly in R2 (e.g. balance_anchors.json / the
      # pin statement). The sync then pushed the stale copy back, silently reverting the edit.
      # R2 holds the full sync state, so pulling it fresh each run is authoritative and correct.

      - name: Pull data state from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync "s3://otomy-data" data --endpoint-url "${{ secrets.R2_ENDPOINT }}" --exact-timestamps --only-show-errors

      - name: Install dependencies
        run: python3 -m pip install --quiet requests

      - name: Fetch from ERP and generate JSON
        env:
          ERP_BASE: ${{ secrets.ERP_BASE }}
          ERP_ORG: ${{ secrets.ERP_ORG }}
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASS: ${{ secrets.ERP_PASS }}
          OTOMY_SYNC_MODE: ${{ github.event.inputs.sync_mode || 'recent' }}
          OTOMY_FULL_FROM: ${{ github.event.inputs.full_from || '2026-04-01' }}
          OTOMY_RECENT_DAYS: "7"
          # Full customer-ledger refresh is heavy (~99 calls) and this workflow is dispatched every
          # few minutes, so the script self-limits to once/day. Set '1' ONLY via a manual force input.
          OTOMY_FETCH_CUST_LEDGERS: ${{ github.event.inputs.full_cust_ledgers == 'true' && '1' || '' }}
          OTOMY_ERP_RETRIES: "3"
          OTOMY_ERP_RETRY_DELAY: "1.5"
          OTOMY_DEBTOR_WORKERS: "4"
          OTOMY_BALANCE_WORKERS: "4"
        run: python3 scripts/gha_sync.py

      - name: Verify dashboard parity guard
        run: python3 scripts/verify_dashboard_parity.py

      - name: Push data to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync data "s3://otomy-data" --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
