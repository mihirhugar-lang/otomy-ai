name: Refresh JSON data
on:
  schedule:
    # GitHub cron is UTC; IST = UTC+5:30.
    # Daytime 06:00-23:00 IST (= 00:30-17:30 UTC): every 10 min.
    - cron: '30,40,50 0 * * *'   # 00:30-00:50 UTC  (06:00-06:20 IST)
    - cron: '*/10 1-16 * * *'    # 01:00-16:59 UTC  (06:30-22:29 IST)
    - cron: '0,10,20 17 * * *'   # 17:00-17:20 UTC  (22:30-22:50 IST)
    # Night 23:00-06:00 IST (= 17:30-00:30 UTC): every 30 min.
    - cron: '30 17 * * *'        # 17:30 UTC        (23:00 IST)
    - cron: '0,30 18-23 * * *'   # 18:00-23:30 UTC  (23:30-05:00 IST)
    - cron: '0 0 * * *'          # 00:00 UTC        (05:30 IST)
  workflow_dispatch:
    inputs:
      full_cust_ledgers:
        description: "Force a full customer-ledger refresh this run"
        type: boolean
        default: false
      sync_mode:
        description: "Sync window: recent (last 7 days) or monthly (from 1st of last month — re-fetches older rows)"
        type: choice
        options:
          - recent
          - monthly
        default: recent

concurrency:
  group: otomy-erp-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore data state (cache)
        uses: actions/cache@v4
        with:
          path: data
          key: otomy-data-${{ github.run_id }}
          restore-keys: otomy-data-

      - name: Pull data state from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync "s3://otomy-data" data --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors

      - name: Install dependencies
        run: python3 -m pip install --quiet requests

      - name: Fetch from ERP and generate JSON
        env:
          ERP_BASE: ${{ secrets.ERP_BASE }}
          ERP_ORG: ${{ secrets.ERP_ORG }}
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASS: ${{ secrets.ERP_PASS }}
          OTOMY_SYNC_MODE: ${{ github.event.inputs.sync_mode || 'recent' }}
          OTOMY_RECENT_DAYS: "7"
          # Full customer-ledger refresh is heavy (~99 calls) and this workflow is dispatched every
          # few minutes, so the script self-limits to once/day. Set '1' ONLY via a manual force input.
          OTOMY_FETCH_CUST_LEDGERS: ${{ github.event.inputs.full_cust_ledgers == 'true' && '1' || '' }}
          OTOMY_ERP_RETRIES: "3"
          OTOMY_ERP_RETRY_DELAY: "1.5"
          OTOMY_DEBTOR_WORKERS: "4"
          OTOMY_BALANCE_WORKERS: "4"
        run: python3 scripts/gha_sync.py

      - name: Verify dashboard parity guard
        run: python3 scripts/verify_dashboard_parity.py

      - name: Push data to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync data "s3://otomy-data" --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
