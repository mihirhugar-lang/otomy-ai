name: Deploy Otomy sync trigger

on:
  push:
    paths:
      - "sync_trigger/**"
      - ".github/workflows/deploy-sync-trigger.yml"
  workflow_dispatch:

concurrency:
  group: otomy-sync-trigger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Cloudflare Cron Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "95339738c3c36e84444485e07178e635"
        run: npx --yes wrangler@latest deploy --config sync_trigger/wrangler.jsonc
