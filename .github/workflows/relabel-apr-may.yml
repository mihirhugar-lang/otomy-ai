name: Relabel Apr-May director expenses (one-shot)
# The accountant renamed these categories in loctell to "... SIR SHARE" AFTER otomy's Apr-May archive
# was built, so otomy still holds the old labels and fails to exclude the draws (localhost, imported
# later, has the new names). This surgically relabels ONLY those two categories in the Apr & May
# archive months so otomy's director exclusion + negative-cash fix (both key on "SHARE") match localhost.
on:
  workflow_dispatch:

jobs:
  relabel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pull data state from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync "s3://otomy-data" data --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
      - name: Relabel Apr/May director categories
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import gha_sync as g
          MAP = {"PRASHANTH SIR (NJP)": "PRASHANTH SIR SHARE", "KUMAR SIR PROFIT": "KUMAR SIR SHARE"}
          for m in ["2026-04", "2026-05"]:
              p = f"data/archive/{m}.json"
              d = json.load(open(p))
              exps = d.get("expenses", [])
              def diradj():
                  return sum(float(x.get("amount") or 0) for x in exps
                             if g._is_director_payment(x.get("category"), x.get("description"),
                                                       x.get("payment_mode"), x.get("notes"), when=x.get("date")))
              before = diradj(); n = 0
              for e in exps:
                  if e.get("category") in MAP:
                      e["category"] = MAP[e["category"]]; n += 1
              after = diradj()
              json.dump(d, open(p, "w"))
              print(f"  {m}: relabeled {n} rows | director-excl {before:,.0f} -> {after:,.0f}")
          PY
      - name: Push updated archive months back to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          aws s3 cp data/archive/2026-04.json "s3://otomy-data/archive/2026-04.json" --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
          aws s3 cp data/archive/2026-05.json "s3://otomy-data/archive/2026-05.json" --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
          echo "Pushed relabeled 2026-04 + 2026-05 archive months to R2."
