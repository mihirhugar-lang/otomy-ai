name: Inspect Otomy dashboard snapshot

defaults:
  run:
    shell: python3 scripts/private_workflow_step.py {0}

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Inclusive start date (YYYY-MM-DD)"
        required: true
        default: "2026-08-01"
      to_date:
        description: "Inclusive end date (YYYY-MM-DD)"
        required: true
        default: "2026-08-10"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read dashboard snapshot from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: bash scripts/inspect_dashboard_snapshot.sh
