name: Private encrypted archive inspection
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: Inclusive start date
        required: true
      to_date:
        description: Inclusive end date
        required: true
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/otomy-private-diagnostic-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only audit dependency
        shell: python3 scripts/private_workflow_step.py {0}
        run: python3 -m pip install --quiet 'boto3==1.42.97'
      - name: Read and encrypt archive
        shell: python3 scripts/private_workflow_step.py {0}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p "$RUNNER_TEMP/otomy-private-input" "$RUNNER_TEMP/otomy-encrypted"
          aws s3 cp s3://otomy-data/archive/2026-11.json "$RUNNER_TEMP/otomy-private-input/2026-11.json" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp s3://otomy-data/archive/2026-10.json "$RUNNER_TEMP/otomy-private-input/2026-10.json" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          for day in 05 06 07 13; do
            book_url="/api/sync/erp/cashbook?from_date=2026-11-${day}&to_date=2026-11-${day}"
            book_key="$(URL="$book_url" python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.environ["URL"].encode()).decode().rstrip("="))')"
            if ! aws s3 cp "s3://otomy-data/snapshot/api/${book_key}.json" "$RUNNER_TEMP/otomy-private-input/book-${day}.json" --endpoint-url "$R2_ENDPOINT" --only-show-errors; then
              [ "$day" != "06" ] || exit 1
            fi
          done
          python3 scripts/audit_daily_cashbooks.py
          tar -czf "$RUNNER_TEMP/otomy-private-input.tar.gz" -C "$RUNNER_TEMP/otomy-private-input" .
          openssl rand -hex 32 > "$RUNNER_TEMP/otomy-one-time-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 -in "$RUNNER_TEMP/otomy-private-input.tar.gz" -out "$RUNNER_TEMP/otomy-encrypted/bundle.enc" -pass "file:$RUNNER_TEMP/otomy-one-time-key"
          openssl pkeyutl -encrypt -pubin -inkey scripts/diagnostic-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/otomy-one-time-key" -out "$RUNNER_TEMP/otomy-encrypted/key.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-otomy-archive
          path: ${{ runner.temp }}/otomy-encrypted/
          retention-days: 1
