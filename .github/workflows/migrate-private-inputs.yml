name: Migrate Otomy private financial inputs

defaults:
  run:
    shell: python3 scripts/private_workflow_step.py {0}

on:
  workflow_dispatch:

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Upload reviewed inputs to private R2 control prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          for file in \
            balance_anchors.json \
            bank_statement_icici_2026-04-01_2026-06-28.json \
            book_balance_accounts.json \
            vendor_master.json \
            aprmay_mirror.json; do
            test -s "seed/$file"
            aws s3 cp "seed/$file" "s3://otomy-data/control/private-seed/$file" \
              --endpoint-url "$R2_ENDPOINT" --content-type application/json --only-show-errors
          done
      - name: Verify private inputs by hash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/otomy-private-inputs"
          mkdir -p "$tmp"
          for file in \
            balance_anchors.json \
            bank_statement_icici_2026-04-01_2026-06-28.json \
            book_balance_accounts.json \
            vendor_master.json \
            aprmay_mirror.json; do
            aws s3 cp "s3://otomy-data/control/private-seed/$file" "$tmp/$file" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors
            cmp "seed/$file" "$tmp/$file"
          done
          echo "Private R2 input migration verified (5 files, byte-for-byte)."
