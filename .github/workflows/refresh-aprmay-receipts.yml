name: Refresh Apr-May receipts (one-shot)
# otomy's Apr-May archive receipts predate localhost's fresh import: they lack the gross
# `payment_received=` note (so the Credit Repayment tile falls back to the net amount) and are a few
# rows short. This replaces the receipts section of the Apr & May archive months with the current,
# complete set built from localhost (in seed/aprmay_receipts.json), which carries the gross
# payment_received. Fixes the Credit Repayment tile (and Apr-May receipt-driven cash-in).
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pull data state from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync "s3://otomy-data" data --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
      - name: Replace Apr/May archive receipts with current set
        run: |
          python3 - <<'PY'
          import json, re
          new = json.load(open("seed/aprmay_receipts.json"))
          def pr(rec):
              m = re.search(r'payment_received=([\d.]+)', str(rec.get("notes") or ""))
              return float(m.group(1)) if m else float(rec.get("amount") or 0)
          for m in ["2026-04", "2026-05"]:
              p = f"data/archive/{m}.json"
              d = json.load(open(p))
              old = d.get("receipts", [])
              before = sum(pr(r) for r in old)
              d["receipts"] = new[m]
              after = sum(pr(r) for r in new[m])
              json.dump(d, open(p, "w"))
              print(f"  {m}: receipts {len(old)} -> {len(new[m])} | payment_received {before:,.0f} -> {after:,.0f}")
          PY
      - name: Push updated archive months back to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          aws s3 cp data/archive/2026-04.json "s3://otomy-data/archive/2026-04.json" --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
          aws s3 cp data/archive/2026-05.json "s3://otomy-data/archive/2026-05.json" --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
          echo "Pushed refreshed 2026-04 + 2026-05 receipts to R2."
