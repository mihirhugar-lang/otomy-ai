name: Backfill MDP Ton (one-off)
on:
  workflow_dispatch:

concurrency:
  group: otomy-erp-sync
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pull data state from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync "s3://otomy-data" data --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors

      - name: Install dependencies
        run: python3 -m pip install --quiet requests

      - name: Backfill real MDP Ton into every archive month
        env:
          ERP_BASE: ${{ secrets.ERP_BASE }}
          ERP_ORG: ${{ secrets.ERP_ORG }}
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASS: ${{ secrets.ERP_PASS }}
        run: python3 scripts/backfill_mdp_archive.py

      - name: Push data to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync data "s3://otomy-data" --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
