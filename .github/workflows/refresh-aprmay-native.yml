name: Refresh Apr-May native (one-shot)
# Rebuild otomy's Apr-May archive natively from loctell (sales + receipts + ledgers) so the
# credit-repayment receipts carry the same loctell customer names / sales split as the sales,
# fixing the same-day-spot overlap residual. 120-day window covers Apr 1 -> today. Run OFF-PEAK
# (loctell times out in business hours). Replaces the earlier manual receipt patch with native data.
on:
  workflow_dispatch:

concurrency:
  group: otomy-erp-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pull data state from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync "s3://otomy-data" data --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
      - name: Install dependencies
        run: python3 -m pip install --quiet requests
      - name: Fetch Apr->today from ERP + full ledgers, rebuild archive
        env:
          ERP_BASE: ${{ secrets.ERP_BASE }}
          ERP_ORG: ${{ secrets.ERP_ORG }}
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASS: ${{ secrets.ERP_PASS }}
          OTOMY_SYNC_MODE: recent
          OTOMY_RECENT_DAYS: "120"
          OTOMY_FETCH_CUST_LEDGERS: "1"
          OTOMY_ERP_RETRIES: "6"
          OTOMY_ERP_RETRY_DELAY: "3"
          OTOMY_DEBTOR_WORKERS: "4"
          OTOMY_BALANCE_WORKERS: "4"
        run: python3 scripts/gha_sync.py
      - name: Verify dashboard parity guard
        run: python3 scripts/verify_dashboard_parity.py
      - name: Push data to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync data "s3://otomy-data" --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
