name: Verify This-FY tiles (diagnostic)
# Read-only: pull live R2, replicate _archiveControl's exact FY aggregation (frontend director logic),
# print the tiles so we can compare against localhost. Writes nothing back.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull data state from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync "s3://otomy-data" data --endpoint-url "${{ secrets.R2_ENDPOINT }}" --only-show-errors
      - name: Compute FY tiles (mirror of frontend _archiveControl)
        run: |
          python3 - <<'PY'
          import json, os, datetime
          def num(x):
              try: return float(x or 0)
              except: return 0.0
          FROM = "2026-04-01"; TO = datetime.date(2026,7,29).isoformat()   # match localhost run
          # frontend _isDirectorPayment: DIRECTOR check on values[0], PRASHANT/KUMAR anywhere, date-scoped SHARE before June
          def isdir(vals, when):
              text = " ".join(str(v or "") for v in vals).upper()
              if "DIRECTOR" in str(vals[0] or "").upper(): return False
              if not ("PRASHANT" in text or "KUMAR" in text): return False
              if when is not None and str(when) < "2026-06-01": return "SHARE" in text
              return True
          def inrange(d): return d and FROM <= str(d)[:10] <= TO
          totalSales=totalQty=expAdj=labourAdj=partsAdj=0.0
          for m in ["2026-04","2026-05","2026-06","2026-07"]:
              p=f"data/archive/{m}.json"
              if not os.path.exists(p): continue
              d=json.load(open(p))
              for s in d.get("sales",[]):
                  if inrange(s.get("date")):
                      totalSales += num(s.get("amount"))+num(s.get("transport_charge")); totalQty += num(s.get("qty_mt"))
              for e in d.get("expenses",[]):
                  if inrange(e.get("date")) and not isdir([e.get("category"),e.get("description"),e.get("payment_mode"),e.get("notes")], e.get("date")):
                      expAdj += num(e.get("amount"))
              for l in d.get("labour",[]):
                  if inrange(l.get("date")) and not isdir([l.get("worker_name"),l.get("worker_type"),l.get("notes")], l.get("date")):
                      labourAdj += num(l.get("amount"))
              for pr in d.get("parts",[]):
                  if inrange(pr.get("date")) and not isdir([pr.get("machine_name"),pr.get("part_name"),pr.get("supplier"),pr.get("notes")], pr.get("date")):
                      partsAdj += num(pr.get("total_amount"))
          expensesAdj = expAdj+labourAdj+partsAdj
          profit = totalSales - expensesAdj
          print("=== OTOMY This-FY (Apr1..Jul29), _archiveControl replica ===")
          print(f"  sales_qty_mt        {totalQty:,.2f}")
          print(f"  totalSales          {totalSales:,.2f}")
          print(f"  expenses(operating) {expensesAdj:,.2f}   (exp {expAdj:,.0f} + labour {labourAdj:,.0f} + parts {partsAdj:,.0f})")
          print(f"  profit              {profit:,.2f}")
          print(f"  expenses/tonne      {expensesAdj/totalQty if totalQty else 0:,.2f}")
          print(f"  profit/tonne        {profit/totalQty if totalQty else 0:,.2f}")
          print("  --- localhost target: qty 50,736.85 | sales 33,569,900 | exp 25,554,208 | profit 8,015,692 ---")
          PY
